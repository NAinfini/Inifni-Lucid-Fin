name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Closure, Type Check, Test, Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26.5.1

      - run: pnpm install --frozen-lockfile

      - name: 1/5 Build (ordered workspace deps)
        run: pnpm run build

      - name: 2/5 Production closure
        run: pnpm run check:production-closure

      - name: 3/5 Type Check
        run: pnpm run test:types

      - name: 4/5 Test
        run: pnpm test -- --reporter=verbose
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: 5/5 Lint
        run: pnpm run lint
