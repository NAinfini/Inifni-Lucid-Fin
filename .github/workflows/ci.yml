name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Type Check, Test, Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26.5.1

      - run: pnpm install --frozen-lockfile

      - name: 1/4 Build (ordered workspace deps)
        run: pnpm run build

      - name: 2/4 Type Check
        run: |
          pnpm exec tsc --noEmit -p packages/contracts/tsconfig.json
          pnpm exec tsc --noEmit -p packages/application/tsconfig.json
          pnpm exec tsc --noEmit -p packages/adapters-ai/tsconfig.json
          pnpm run test:types

      - name: 3/4 Test
        run: pnpm test -- --reporter=verbose
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: 4/4 Lint
        run: pnpm exec eslint . --max-warnings=0
