name: Bundle Size Guard
on:
  pull_request:
    paths: ['apps/desktop-renderer/**', 'packages/**']
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify renderer chunk is zod-free
        run: |
          if grep -rn 'ZodType\|ZodObject\|ZodString\|z\.string\|z\.object\|z\.number' \
            apps/desktop-renderer/dist/assets/*.js 2>/dev/null; then
            echo "::error::Zod detected in renderer bundle. Renderer must consume the generated desktop wire API without runtime schema imports."
            exit 1
          fi
          echo "✓ Renderer chunk is zod-free."
      - name: Check total renderer bundle size
        shell: bash
        run: |
          TOTAL=$(du -sb apps/desktop-renderer/dist/assets/ | cut -f1)
          MAX_BYTES=8388608
          echo "Total renderer bundle: $TOTAL bytes (budget: $MAX_BYTES)"
          if [ "$TOTAL" -gt "$MAX_BYTES" ]; then
            echo "::error::Renderer bundle exceeds 8MB budget ($TOTAL bytes)"
            exit 1
          fi
          echo "Bundle size within budget."
