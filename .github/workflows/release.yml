name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            platform_key: win32-x64
            artifact: win-x64
          - os: windows-11-arm
            platform: win
            arch: arm64
            platform_key: win32-arm64
            artifact: win-arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            platform_key: darwin-x64
            artifact: mac-x64
          - os: macos-15
            platform: mac
            arch: arm64
            platform_key: darwin-arm64
            artifact: mac-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            platform_key: linux-x64
            artifact: linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    name: Build (${{ matrix.artifact }})

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26.5.1

      - run: pnpm install --frozen-lockfile

      - name: Resolve the pinned FFmpeg artifact kind
        id: ffmpeg
        shell: bash
        run: |
          kind="$(node -e "const manifest = require('./packages/media-engine/ffmpeg-checksums.json'); process.stdout.write(manifest.platforms[process.argv[1]].kind)" "${{ matrix.platform_key }}")"
          if [[ "$kind" != 'archive' && "$kind" != 'source-build' ]]; then
            echo "Unsupported FFmpeg artifact kind: $kind" >&2
            exit 1
          fi
          if [[ "$kind" == 'source-build' && "${{ matrix.platform_key }}" != darwin-* ]]; then
            echo "Source builds are allowed only for macOS FFmpeg payloads" >&2
            exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Restore verified FFmpeg archive
        if: steps.ffmpeg.outputs.kind == 'archive'
        run: node scripts/fetch-ffmpeg.ts --platform ${{ matrix.platform_key }}

      - name: Build verified macOS LGPL FFmpeg payload
        if: steps.ffmpeg.outputs.kind == 'source-build'
        run: bash scripts/build-ffmpeg-macos-lgpl.sh --output resources/bin/${{ matrix.platform_key }}

      - name: Rebuild native modules
        run: pnpm exec electron-rebuild -f -w better-sqlite3 -v 43.2.0

      - name: Build all packages (ordered)
        run: pnpm run build

      - name: Package installer (local only, no publish)
        run: pnpm exec electron-builder --config electron-builder.json --${{ matrix.platform }} --${{ matrix.arch }} --publish=never
        working-directory: apps/desktop-main

      - name: List built artifacts
        run: ls -R apps/desktop-main/release/ || echo "No release files"
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            apps/desktop-main/release/*.exe
            apps/desktop-main/release/*.dmg
            apps/desktop-main/release/*.zip
            apps/desktop-main/release/*.AppImage
            apps/desktop-main/release/*.deb
            apps/desktop-main/release/*.blockmap
            apps/desktop-main/release/*.yml
            apps/desktop-main/release/*.yaml
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sort || echo "No artifacts found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the complete draft release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
