packages:
  - 'apps/*'
  - 'packages/*'

# Electron Builder and the native-runtime/release checks consume a flat
# node_modules tree. Keep that packaging boundary explicit under pnpm.
nodeLinker: hoisted
packageImportMethod: copy

overrides:
  '@babel/core': '7.29.7'
  '@radix-ui/react-primitive': '2.1.10'
  '@radix-ui/react-slot': '1.3.3'
  dompurify: '3.4.12'
  js-yaml: '4.3.1'
  'minimatch@10.2.5>brace-expansion': '5.0.9'
  tmp: '0.2.7'
  typescript: '6.0.2'

allowBuilds:
  better-sqlite3: true
  electron: false
  electron-winstaller: true
  esbuild: true
  keytar: true
