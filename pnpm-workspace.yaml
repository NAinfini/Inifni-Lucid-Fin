packages:
  - 'apps/*'
  - 'packages/*'

# Electron Builder consumes a flat node_modules tree. Keep that packaging
# boundary explicit under pnpm.
nodeLinker: hoisted
packageImportMethod: copy

overrides:
  '@babel/core': '7.29.7'
  dompurify: '3.4.12'
  js-yaml: '4.3.1'
  'minimatch@10.2.5>brace-expansion': '5.0.9'
  tmp: '0.2.7'
  typescript: '6.0.2'

allowBuilds:
  electron: false
  electron-winstaller: true
  esbuild: true
  keytar: true
